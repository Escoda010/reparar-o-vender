<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280" role="img" aria-label="Los tres veredictos: repara por debajo del 20 % del valor del coche, valóralo entre el 20 y el 50 %, vende por encima del 50 %">
  <rect width="600" height="280" fill="#ffffff"/>
  <g font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
    <rect x="0" y="0" width="200" height="200" fill="#1f7a3f"/>
    <rect x="200" y="0" width="200" height="200" fill="#d99a00"/>
    <rect x="400" y="0" width="200" height="200" fill="#b42318"/>
    <text x="100" y="92" font-size="30" font-weight="800" fill="#ffffff">REPARA</text>
    <text x="300" y="80" font-size="27" font-weight="800" fill="#14181f">VALÓRALO</text>
    <text x="300" y="112" font-size="27" font-weight="800" fill="#14181f">BIEN</text>
    <text x="500" y="92" font-size="30" font-weight="800" fill="#ffffff">VENDE</text>
    <text x="100" y="140" font-size="22" font-weight="600" fill="#ffffff">menos del 20 %</text>
    <text x="300" y="150" font-size="22" font-weight="600" fill="#14181f">del 20 al 50 %</text>
    <text x="500" y="140" font-size="22" font-weight="600" fill="#ffffff">más del 50 %</text>
    <rect x="0" y="200" width="600" height="6" fill="#0f2341"/>
    <text x="300" y="250" font-size="21" font-weight="700" fill="#14181f">Coste de la reparación respecto al valor de mercado del coche</text>
  </g>
</svg>
